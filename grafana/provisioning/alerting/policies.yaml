apiVersion: 1
policies:
  - orgId: 1
    receiver: email-oncall      # all alerts go to the email contact point
    group_by: ["alertname"]     # one email per alert, not one per data point
    group_wait: 30s             # wait 30s to collect related alerts into one email
    group_interval: 1m
    repeat_interval: 4h         # if still broken, remind again after 4 hours
