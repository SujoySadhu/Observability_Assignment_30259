apiVersion: 1
groups:
  - orgId: 1
    name: shoplite-availability
    folder: ShopLite
    interval: 30s                    # check every 30 seconds
    rules:
      - uid: shoplite-api-down
        title: ShopLite API is down
        condition: C
        data:
          # A = ask Prometheus: is the API target up? (1 = up, 0 = down)
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: up{job="shoplite-api"}
              instant: true
          # C = it is a problem when A is below 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 1m                      # must stay down for 1 minute before alerting
        noDataState: Alerting        # no data at all also counts as a problem
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "ShopLite API is down (Prometheus cannot scrape it)"
          description: "up{job=\"shoplite-api\"} has been 0 for 1 minute. Customers cannot shop."
          runbook: "Check: docker compose ps api / docker compose logs api --tail 50. Restart: docker compose up -d api"
