apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s        # matches the scrape interval
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
