# ShopLite + observability stack (Task 2), candidate 30259
#   cp .env.example .env   (then set the passwords)
#   docker compose up -d --build
# All ports bind to the VirtualBox host-only IP 192.168.56.20 (reachable only from this PC).

name: obs

x-restart: &restart
  restart: unless-stopped     # survive crashes and VM reboots, but respect "docker compose stop"

services:
  # ---------------- Application ----------------
  postgres:
    image: postgres:17-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # no ports: only containers on this network can reach the database

  api:
    build: ./app/backend
    <<: *restart
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-orders}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-orders}
      APP_VERSION: "2.0.0"
      LOG_LEVEL: INFO
      DB_POOL_MAX: "10"
      FLAWS: ${FLAWS-slow_queries,memory_leak,coupon_bug,slow_login}
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "192.168.56.20:8000:8000"   # order-worker pod in MicroK8s calls this

  web:
    build: ./app/frontend
    <<: *restart
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "192.168.56.20:8080:80"

  # ---------------- Observability ----------------
  node-exporter:
    image: prom/node-exporter:v1.9.1
    <<: *restart
    network_mode: host          # see the VM's real network interfaces
    pid: host                   # see the VM's real processes
    volumes:
      - /:/host:ro,rslave       # whole VM filesystem, read-only
    command:
      - --path.rootfs=/host
      - --web.listen-address=192.168.56.20:9100

  prometheus:
    image: prom/prometheus:v3.5.0
    <<: *restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # allows: curl -X POST .../-/reload
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "192.168.56.20:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  loki:
    image: grafana/loki:3.5.3
    <<: *restart
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "192.168.56.20:3100:3100"   # Alloy in MicroK8s pushes logs here

  grafana:
    image: grafana/grafana:12.1.0
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://192.168.56.20:3000
      # Outgoing email (Task 7). Secrets come from .env, never from this file.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      GF_SMTP_FROM_ADDRESS: ${SMTP_USER}
      GF_SMTP_FROM_NAME: ShopLite Grafana
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?Set ALERT_EMAIL_TO in .env}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "192.168.56.20:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:            # named volumes: data survives "down", restarts and reboots
  pgdata:
  prometheus-data:
  loki-data:
  grafana-data:
