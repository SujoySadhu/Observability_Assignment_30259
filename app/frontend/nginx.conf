# nginx serves the static frontend and reverse-proxies /api to the backend.
# The browser only ever talks to nginx (same origin, so no CORS needed).

# One JSON line per request. $request_id is a random 32-hex ID that nginx
# also forwards to the API, so the SAME ID appears in both logs.
log_format json_access escape=json
  '{"ts":"$time_iso8601","service":"web","remote":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration_s":$request_time,'
  '"upstream_s":"$upstream_response_time","request_id":"$request_id"}';

upstream order_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    access_log /dev/stdout json_access;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # Revalidate on every load so a new deploy is picked up immediately
        # (files are unversioned; nginx still answers 304 if nothing changed).
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://order_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    location = /health {
        proxy_pass http://order_api/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://order_api/ready;
        access_log off;
    }

    # Metrics are for Prometheus on the internal network, never the public site.
    location = /metrics {
        return 404;
    }
}
